[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-integrity-eval"
version = "0.1.0"
description = "Reproducible integrity evaluations for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Esteban Orrego" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
aie = "agent_integrity_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_integrity_eval"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
